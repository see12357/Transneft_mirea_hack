services:
  redis:
    image: redis:alpine
    container_name: transneft-redis
    restart: unless-stopped

  ollama:
    # Используем простой официальный образ
    image: ollama/ollama
    container_name: transneft-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: transneft-backend
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: transneft-frontend-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # --- НОВЫЙ СЕРВИС ДЛЯ ЗАПУСКА БЕНЧМАРКА ---
  benchmark:
    # Мы используем ту же сборку, что и для бэкенда,
    # чтобы гарантировать идентичное окружение.
    build:
      context: ./backend
      args:
        - HF_TOKEN=${HF_TOKEN}

    # Вместо запуска веб-сервера, мы запускаем ваш скрипт.
    command: ["python", "ev.py"]

    # Бенчмарку для работы нужен только Ollama.
    depends_on:
      - ollama

    # Важно: мы не перезапускаем этот сервис. Он должен выполниться и завершиться.
    restart: "no"

volumes:
  ollama_data: