# Файл: docker-compose.yml

version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: transneft-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: transneft-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: transneft-backend
    ports:
      - "8000:8000"
    volumes:
      - models_cache:/root/.cache/huggingface
    environment:
      - REDIS_HOST=redis
      - OLLAMA_HOST=ollama
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: transneft-frontend-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:
  models_cache: