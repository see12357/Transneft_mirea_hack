services:
  redis:
    image: redis:alpine
    container_name: transneft-redis

  backend:
    build:
      context: ./backend
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: transneft-backend
    environment:
      - REDIS_HOST=redis
      - OLLAMA_HOST=ollama # (Если вы используете Ollama в Docker)
    # Порты пробрасывать не нужно, т.к. Nginx будет общаться с ним внутри сети
    depends_on:
      - redis
      # - ollama # (Раскомментируйте, если Ollama в Docker)
    extra_hosts:
      # Оставьте эту строку, если Ollama работает на вашем компьютере, а не в Docker
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: transneft-frontend-nginx
    ports:
      # Ваше приложение будет доступно по http://localhost
      - "80:80"
    depends_on:
      - backend