# version: '3.8' # Эта строка устарела и может быть удалена

services:
  # Сервис Redis для хранения истории чатов
  redis:
    image: redis:alpine
    container_name: transneft-redis

  # Сервис Бэкенда (Python, FastAPI, LangChain)
  backend:
    build:
      context: ./backend
      # Передаем секретный токен Hugging Face в Dockerfile во время сборки
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: transneft-backend
    environment:
      # Указываем, что Redis доступен по имени сервиса 'redis'
      - REDIS_HOST=redis
    depends_on:
      - redis
    # Пробрасываем доступ к Ollama, работающему на хост-машине (вашем ноутбуке)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Сервис Фронтенда, который включает в себя сборку React и запуск Nginx
  frontend:
    build: ./frontend
    container_name: transneft-frontend-nginx
    ports:
      # Пробрасываем порт 80 контейнера на порт 80 вашего компьютера.
      # Ваше приложение будет доступно по http://localhost
      - "80:80"
    depends_on:
      # Фронтенд запустится только после успешного старта бэкенда
      - backend