server {
    listen 80;
    server_name localhost;

    # --- Правило для раздачи статики (фронтенда) ---
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Эта строка важна для React/Vite (SPA - Single Page Application),
        # чтобы при обновлении страницы не было ошибки 404
        try_files $uri /index.html;
    }

    # --- Правило для перенаправления API-запросов на бэкенд ---
    location /api {
        # Перенаправляем запрос на сервис 'backend' на порт 8000
        # (имя 'backend' берется из docker-compose.yml)
        proxy_pass http://backend:8000;

        # Передаем необходимые заголовки, чтобы бэкенд знал, откуда пришел запрос
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}