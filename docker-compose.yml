version: '3.8'

services:
  # Сервис Redis для хранения истории чатов
  redis:
    image: redis:alpine
    container_name: transneft-redis
    ports:
      # Пробрасываем порт для отладки, если нужно подключиться к Redis напрямую
      - "6379:6379"

  # Сервис Бэкенда (Python, FastAPI, LangChain)
  backend:
    build:
      context: ./backend
      # Передаем секретный токен Hugging Face в Dockerfile во время сборки
      args:
        - HF_TOKEN=${HF_TOKEN}
    container_name: transneft-backend
    environment:
      # Указываем, что Redis доступен по имени сервиса 'redis'
      - REDIS_HOST=redis
    depends_on:
      - redis
    # Пробрасываем доступ к Ollama, работающему на хост-машине (вашем ноутбуке)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Для отладки можно раскомментировать порты, чтобы обращаться к API напрямую
    # ports:
    #   - "8000:8000"

  # Сервис Фронтенда (React, Vite) - только для сборки
  frontend:
    build:
      context: ./frontend
    container_name: transneft-frontend-builder
    # Этот контейнер только собирает статику и не запускается

  # Сервис Nginx (Веб-сервер и обратный прокси)
  nginx:
    image: nginx:stable-alpine
    container_name: transneft-nginx
    ports:
      # Вся система будет доступна снаружи по порту 80
      - "80:80"
    volumes:
      # Подключаем нашу кастомную конфигурацию Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      # Nginx запустится только после успешного старта бэкенда
      - backend